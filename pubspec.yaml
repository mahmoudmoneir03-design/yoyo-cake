name: dafter_tort
description: Yoyo Cake - طلبات وعملاء وعربون وتكلفة خامات وتقارير ربح.
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.3.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  shared_preferences: ^2.2.3
  path_provider: ^2.1.3
  share_plus: ^10.0.0
  url_launcher: ^6.3.0
  flutter_native_contact_picker: 0.0.11
  flutter_local_notifications: ^19.5.0
  timezone: ^0.10.0

dev_dependencies:
  flutter_lints: ^4.0.0
  flutter_launcher_icons: ^0.14.3

flutter:
  uses-material-design: true
  assets:
    - assets/icon/icon.png

flutter_launcher_icons:
  android: true
  ios: false
  image_path: "assets/icon/icon.png"
  adaptive_icon_background: "#FFFFFF"
  adaptive_icon_foreground: "assets/icon/icon_fg.png"
